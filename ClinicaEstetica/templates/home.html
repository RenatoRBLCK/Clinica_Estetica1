{% extends 'base.html' %}
{% block contenido %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
    <h1>Bienvenido a la Clínica Estética</h1>
    <p class="fs-4">Gestión integral de servicios, productos y clientes.</p>
    {% if user.is_authenticated %}
        <a href="{% url 'registrar_atencion' %}" class="btn btn-lg btn-primary">Nueva Atención</a>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-lg btn-success">Iniciar Sesión</a>
    {% endif %}
</div>
{% endblock %}
